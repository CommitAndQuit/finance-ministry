name: Update F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-update
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver apksigner

      - name: Download latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo
          
          # Try to download APK from latest release
          if gh release download --pattern "*.apk" --dir fdroid/repo 2>/dev/null; then
            echo "APK downloaded successfully"
            ls -la fdroid/repo/
          else
            echo "No release APK found. Creating placeholder for empty repo."
          fi

      - name: Initialize and update F-Droid repository
        working-directory: fdroid
        run: |
          set -e
          
          # Initialize the repository (creates signing key and config)
          if [ ! -f repo_key ]; then
            echo "Initializing new F-Droid repository..."
            fdroid init
          fi
          
          # Update config with correct URL
          sed -i 's|repo_url:.*|repo_url: https://commitandquit.github.io/finance-ministry/fdroid/repo|' config.yml || true
          
          # Create/update the repository index
          echo "Updating F-Droid repository index..."
          fdroid update --create-metadata --pretty
          
          # Verify index was created
          ls -la repo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: fdroid

  deploy-pages:
    needs: update-repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
